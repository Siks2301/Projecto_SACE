# =====================================================================
# nginx para SACE
#   - Sirve el frontend estatico (frontend-aleleo-tours)
#   - Proxy inverso hacia la API Spring Boot
#   - Redirige todo a HTTPS
#
# Dominios esperados:
#   aleleotours.com / www.aleleotours.com  -> frontend
#   api.aleleotours.com                    -> API REST
#
# Si los dominios son otros, cambialos aqui Y en el bloque 'ssl' de
# /etc/nginx/conf.d/default.conf (si activaste HTTPS con certbot).
# =====================================================================

# ---------- Frontend: HTTP -> HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name aleleotours.com www.aleleotours.com;

    # Validacion de certificados (Let's Encrypt). Debe responder por HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.aleleotours.com$request_uri;
    }
}

# ---------- Frontend: HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aleleotours.com www.aleleotours.com;

    ssl_certificate     /etc/letsencrypt/live/aleleotours.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aleleotours.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    # Compresion de texto (CSS, JS, JSON, SVG).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad basicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache de recursos estaticos.
    location ~* \.(?:css|js|jpe?g|png|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        access_log off;
    }

    # Paginas .html: se validan contra el servidor para no servir una
    # version vieja del sitio tras un despliegue.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# ---------- API: HTTP -> HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.aleleotours.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.aleleotours.com$request_uri;
    }
}

# ---------- API: HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.aleleotours.com;

    ssl_certificate     /etc/letsencrypt/live/aleleotours.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aleleotours.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # El proxy debe avisarle al backend que la peticion original venia
    # por HTTPS. Spring Boot lo lee gracias a
    # server.forward-headers-strategy=framework.
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://api:8082;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
