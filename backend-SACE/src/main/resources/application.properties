spring.application.name=SACE
server.port=8082
spring.datasource.url=jdbc:postgresql://localhost:5432/SACE_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# --- Seguridad: tokens de acceso (AuthInterceptor + TokenServicio) ---
app.security.token.secreto=${SACE_TOKEN_SECRET:Cl4veDesarrolloSACE_AleLeoTours_2024_CambiarEnProduccion}
app.security.token.horas-expiracion=24

# --- Correo Notificaciones & Propietario ---
app.propietario.email=${PROPIETARIO_EMAIL:propietario@aleleotours.com}

# Configuración SMTP (Fail-Safe activado en EmailNotificacionServicio)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:notificaciones@aleleotours.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:secret}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- Almacenamiento de Comprobantes PDF ---
app.upload.dir=uploads/comprobantes

# =====================================================================
# MODULO DE PAGOS (pasarela de pagos)
# =====================================================================
# Selecciona la pasarela activa:
#   mock  = simulada, sin internet y sin llaves. Es el valor por defecto
#           porque el proyecto debe funcionar sin ninguna configuracion previa.
#   wompi = pasarela real de Wompi (modo sandbox mientras use llaves test_).
app.pagos.pasarela=${PAGOS_PASARELA:mock}

# Metodos de pago que el sistema acepta. Un valor no valido se descarta con un
# aviso en el log, en lugar de impedir que la aplicacion arranque.
app.pagos.metodos-habilitados=${PAGOS_METODOS:PSE,TARJETA}

# --- Wompi: ambiente y llaves ---
# Sandbox:    https://sandbox.wompi.co/v1   con llaves pub_test_ / test_
# Produccion: https://checkout.wompi.co/v1  con llaves pub_prod_ / prod_
# Las llaves se leen del entorno. NO deben escribirse aqui: este archivo viaja
# en el repositorio.
app.pagos.wompi.base-url=${WOMPI_BASE_URL:https://sandbox.wompi.co/v1}
app.pagos.wompi.clave-publica=${WOMPI_PUB_KEY:}
app.pagos.wompi.clave-privada=${WOMPI_PRV_KEY:}
app.pagos.wompi.clave-integridad=${WOMPI_INTEGRITY_KEY:}
app.pagos.wompi.secreto-eventos=${WOMPI_EVENTS_SECRET:}

# Checkout alojado de Wompi (solo para el flujo por navegador)
app.pagos.wompi.url-checkout=${WOMPI_CHECKOUT_URL:https://checkout.wompi.co/l/}

# --- Pasarela simulada ---
# Retardo antes de resolver el pago. No es un adorno: es lo que hace visible el
# estado "Procesando pago..." en la interfaz durante la demo.
app.pagos.mock.retardo-ms=${PAGOS_MOCK_RETARDO_MS:3000}
# Estado final que produce la simulacion: APROBADO o RECHAZADO.
# Permite ensayar el camino del rechazo sin tocar una linea de codigo.
app.pagos.mock.resultado=${PAGOS_MOCK_RESULTADO:APROBADO}

# --- Conciliacion periodica ---
# Si un webhook se pierde, el pago se quedaria PENDIENTE para siempre aunque la
# pasarela si lo hubiera aprobado. Esta tarea lo cierra preguntandole a la
# pasarela cada cierto tiempo. Ver TareaConciliacionPagos.
app.pagos.conciliacion.intervalo-ms=${PAGOS_CONCILIACION_MS:300000}
app.pagos.conciliacion.espera-inicial-ms=${PAGOS_CONCILIACION_ESPERA_MS:60000}
app.pagos.conciliacion.minutos=${PAGOS_CONCILIACION_MINUTOS:5}
app.pagos.conciliacion.verbose=${PAGOS_CONCILIACION_VERBOSE:false}