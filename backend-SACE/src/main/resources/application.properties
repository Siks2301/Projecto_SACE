spring.application.name=SACE

# =====================================================================
# PUERTO
# Las plataformas en la nube (Render, Railway, Fly.io, Koyeb) inyectan la
# variable PORT. En desarrollo local se mantiene 8082.
# =====================================================================
server.port=${PORT:8082}

# Detras de un proxy inverso (nginx, Cloudflare) esto hace que Spring
# entienda los encabezados X-Forwarded-* que envia el proxy.
server.forward-headers-strategy=framework

# =====================================================================
# BASE DE DATOS POSTGRESQL
# En produccion These tres variables las define la plataforma. Nunca
# escribas la contrasena real en este archivo: viaja en el repositorio.
# =====================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/SACE_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones. En una PaaS con un solo contenedor y una base
# compartida, un pool grande agota los limites del servidor de base de
# datos. 10 conexiones es un valor seguro para este proyecto.
spring.datasource.hikari.maximum-pool-size=${SACE_DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SACE_DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=20000

# =====================================================================
# JPA / HIBERNATE
# ddl-auto=update crea las tablas ausentes al arrancar. Es lo que permite
# que la base de datos nazca sola en el primer despliegue. Cuando el
# esquema este estable, en produccion conviene SACE_DDL_AUTO=none.
# =====================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SACE_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${SACE_DDL_AUTO:update}

# =====================================================================
# SEGURIDAD
# En produccion SACE_TOKEN_SECRET debe ser una cadena larga y aleatoria.
# Generala con:  openssl rand -base64 48
# =====================================================================
app.security.token.secreto=${SACE_TOKEN_SECRET:Cl4veDesarrolloSACE_AleLeoTours_2024_CambiarEnProduccion}
app.security.token.horas-expiracion=${SACE_TOKEN_HORAS:24}

# =====================================================================
# CORREO (Notificaciones & Propietario)
# =====================================================================
app.propietario.email=${PROPIETARIO_EMAIL:propietario@aleleotours.com}

# Configuracion SMTP (Fail-Safe activado en EmailNotificacionServicio)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:notificaciones@aleleotours.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:secret}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}

# =====================================================================
# ALMACENAMIENTO DE COMPROBANTES PDF
# Ruta ABSOLUTA en produccion: en una PaaS el directorio de trabajo es
# efimero y los comprobantes se perderian en cada redespliegue.
#   - Railway con volumen:  /data/comprobantes
#   - Render con disco:     /var/data/comprobantes
#   - Docker Compose:       /app/uploads/comprobantes
# =====================================================================
app.upload.dir=${SACE_UPLOAD_DIR:uploads/comprobantes}

# =====================================================================
# CORS
# Orígenes permitidos para el frontend, separados por coma.
# En produccion:  https://aleleotours.aleleo.workers.dev
#                 (Cloudflare Workers; con dominio propio, https://aleleotours.com)
# =====================================================================
app.cors.origins=${SACE_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# =====================================================================
# USUARIO ADMINISTRADOR SEMILLA
# Si SACE_ADMIN_PASSWORD queda vacio, se usa "admin123" (solo desarrollo).
# En produccion definala SIEMPRE: el seed rota la contrasena del
# administrador a este valor en cada arranque.
# =====================================================================
app.admin.email=${SACE_ADMIN_EMAIL:admin@aleleotours.com}
app.admin.password=${SACE_ADMIN_PASSWORD:}

# =====================================================================
# MODULO DE PAGOS (pasarela de pagos)
#   mock  = simulada, sin internet y sin llaves. Es el valor por defecto
#           porque el proyecto debe funcionar sin ninguna configuracion previa.
#   wompi = pasarela real de Wompi (modo sandbox mientras use llaves test_).
# =====================================================================
app.pagos.pasarela=${PAGOS_PASARELA:mock}

# Metodos de pago que el sistema acepta. Un valor no valido se descarta con un
# aviso en el log, en lugar de impedir que la aplicacion arranque.
app.pagos.metodos-habilitados=${PAGOS_METODOS:PSE,TARJETA}

# --- Wompi: ambiente y llaves ---
# Sandbox:    https://sandbox.wompi.co/v1   con llaves pub_test_ / test_
# Produccion: https://checkout.wompi.co/v1  con llaves pub_prod_ / prod_
# Las llaves se leen del entorno. NO deben escribirse aqui: este archivo viaja
# en el repositorio.
app.pagos.wompi.base-url=${WOMPI_BASE_URL:https://sandbox.wompi.co/v1}
app.pagos.wompi.clave-publica=${WOMPI_PUB_KEY:}
app.pagos.wompi.clave-privada=${WOMPI_PRV_KEY:}
app.pagos.wompi.clave-integridad=${WOMPI_INTEGRITY_KEY:}
app.pagos.wompi.secreto-eventos=${WOMPI_EVENTS_SECRET:}

# Checkout alojado de Wompi (solo para el flujo por navegador)
app.pagos.wompi.url-checkout=${WOMPI_CHECKOUT_URL:https://checkout.wompi.co/l/}

# --- Pasarela simulada ---
# Retardo antes de resolver el pago. No es un adorno: es lo que hace visible el
# estado "Procesando pago..." en la interfaz durante la demo.
app.pagos.mock.retardo-ms=${PAGOS_MOCK_RETARDO_MS:3000}
# Estado final que produce la simulacion: APROBADO o RECHAZADO.
# Permite ensayar el camino del rechazo sin tocar una linea de codigo.
app.pagos.mock.resultado=${PAGOS_MOCK_RESULTADO:APROBADO}

# --- Conciliacion periodica ---
# Si un webhook se pierde, el pago se quedaria PENDIENTE para siempre aunque la
# pasarela si lo hubiera aprobado. Esta tarea lo cierra preguntandole a la
# pasarela cada cierto tiempo. Ver TareaConciliacionPagos.
app.pagos.conciliacion.intervalo-ms=${PAGOS_CONCILIACION_MS:300000}
app.pagos.conciliacion.espera-inicial-ms=${PAGOS_CONCILIACION_ESPERA_MS:60000}
app.pagos.conciliacion.minutos=${PAGOS_CONCILIACION_MINUTOS:5}
app.pagos.conciliacion.verbose=${PAGOS_CONCILIACION_VERBOSE:false}
